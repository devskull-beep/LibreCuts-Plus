name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - devskullcut

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare keystore (if provided)
        if: ${{ secrets.KSTORE_BASE64 }}
        run: |
          echo "Decoding keystore from KSTORE_BASE64..."
          echo "$KSTORE_BASE64" | base64 --decode > librecuts.keystore
          echo "storeFile=librecuts.keystore" > keystore.properties
          echo "storePassword=${STORE_PASSWORD}" >> keystore.properties
          echo "keyAlias=${KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${KEY_PASSWORD}" >> keystore.properties
        env:
          KSTORE_BASE64: ${{ secrets.KSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Grant executable for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
